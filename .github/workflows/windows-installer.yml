name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GEOBASE_TAG: geobase-2026-10-17
  GEOBASE_SHA256: c00a42ff504268be68f72524acde7bebfc58042f472aff589cb2e6af05caa89a
  DEPS_TAG: deps-2026-10-17

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Offline geobase from the release
        run: |
          gh release download "$GEOBASE_TAG" --pattern geobase.sqlite3 --dir src-tauri/resources
          echo "$GEOBASE_SHA256  src-tauri/resources/geobase.sqlite3" | sha256sum -c -

      # Everything the app needs ships inside the installer: users install
      # nothing by hand.
      - name: Bundled ExifTool and FFmpeg from the pinned release
        run: |
          mkdir -p deps && gh release download "$DEPS_TAG" --dir deps
          (cd deps && sha256sum -c SHA256SUMS)
          H=src-tauri/resources/helpers
          mkdir -p $H/exiftool $H/ffmpeg
          7z x -y -odeps/exiftool deps/exiftool-*_64.zip > /dev/null
          E=$(ls -d deps/exiftool/exiftool-*_64)
          cp "$E/exiftool(-k).exe" $H/exiftool/exiftool.exe
          cp -r "$E/exiftool_files" $H/exiftool/
          7z x -y -odeps/ffmpeg deps/ffmpeg-*-win64-lgpl-shared.zip > /dev/null
          F=$(ls -d deps/ffmpeg/ffmpeg-*)
          cp "$F"/bin/ffmpeg.exe "$F"/bin/ffprobe.exe "$F"/bin/*.dll $H/ffmpeg/
          cp "$F/LICENSE.txt" $H/ffmpeg/LICENSE.txt
          $H/exiftool/exiftool.exe -ver
          $H/ffmpeg/ffprobe.exe -hide_banner -version | head -1

      - name: Build installer
        timeout-minutes: 40
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: kadr-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Install it silently on this clean machine and run the bundled helpers
      # from the install folder, the way a user's machine would.
      - name: Smoke test the installed app
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB)) MB)"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "installer did not finish in 5 minutes" }
          "Installer exit code: $($p.ExitCode)"
          $app = Join-Path $env:LOCALAPPDATA 'Kadr'
          Get-ChildItem $app | Format-Table Name, Length
          foreach ($f in 'kadr.exe', 'geobase.sqlite3', 'THIRD_PARTY_NOTICES.md', 'helpers/exiftool/exiftool.exe', 'helpers/ffmpeg/ffprobe.exe', 'helpers/ffmpeg/ffmpeg.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing after install: $f" }
          }
          & (Join-Path $app 'helpers/exiftool/exiftool.exe') -ver
          & (Join-Path $app 'helpers/ffmpeg/ffprobe.exe') -hide_banner -version | Select-Object -First 1
          & (Join-Path $app 'helpers/ffmpeg/ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          & (Join-Path $app 'helpers/exiftool/exiftool.exe') -json -DateTimeOriginal crates/kadr-core/tests/fixtures/media/exif_full.jpg
