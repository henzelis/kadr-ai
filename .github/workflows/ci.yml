name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libimage-exiftool-perl ffmpeg

      - name: macOS metadata helpers (ExifTool, FFprobe)
        if: runner.os == 'macOS'
        run: brew install exiftool ffmpeg

      - name: Windows metadata helpers (ExifTool, FFprobe)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress exiftool ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm check
      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace -- --nocapture
        # Helper-based tests print a NOTICE and pass when a helper is missing;
        # fail CI instead, so they really run on both systems.
      - name: HEIC and AVIF thumbnails through FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/samples"
          curl -fsSL -o "$RUNNER_TEMP/samples/example.heic" https://github.com/strukturag/libheif/raw/v1.19.5/examples/example.heic
          curl -fsSL -o "$RUNNER_TEMP/samples/example.avif" https://github.com/strukturag/libheif/raw/v1.19.5/examples/example.avif
          KADR_FFMPEG=ffmpeg KADR_SAMPLES="$RUNNER_TEMP/samples" cargo test -p kadr-core --test thumbs_real -- --nocapture 2>&1 | tee thumbs.log
          ! grep -q NOTICE thumbs.log

      - name: Helper-based tests really ran
        shell: bash
        run: |
          if cargo test -p kadr-core --test indexer -- --nocapture 2>&1 | grep -q NOTICE; then
            echo "ExifTool/FFprobe not found on PATH"; exit 1
          fi
